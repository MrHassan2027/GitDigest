[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gitdigest"
version = "1.0.0"
description = "Generate a grouped changelog from git history"
requires-python = ">=3.11"
dependencies = ["click>=8", "rich>=13"]

[project.scripts]
gitdigest = "gitdigest.cli:main"
